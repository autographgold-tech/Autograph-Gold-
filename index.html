<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Autograph Menu</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<header class="top">
  <div class="logo">AUTOGRAPH</div>

  <div class="tabs">
    <button class="tab active" data-type="kitchen">🍽 Кухня</button>
    <button class="tab" data-type="bar">🍹 Бар</button>
  </div>

  <input id="search" class="search" placeholder="Поиск по меню..."/>
</header>

<main>
  <div id="menuList"></div>
</main>

<!-- Десктоп корзина -->
<aside id="cartDesktop" class="cart-desktop"></aside>

<!-- Мобильная липкая панель корзины -->
<div id="cartBar" class="cart-bar hidden">
  <span id="cartSummary">🛒 0 поз. • 0 ₸</span>
  <button id="openCart">Открыть</button>
</div>

<!-- Мобильная корзина (попап) -->
<div id="cartModal" class="cart-modal hidden">
  <div class="cart-window">
    <div class="cart-head">
      <b>Корзина</b>
      <button id="closeCart">✕</button>
    </div>

    <div id="cartList"></div>

    <textarea id="comment" placeholder="Комментарий / стол / VIP"></textarea>

    <div class="cart-total">
      <span>Итого:</span>
      <b id="totalSum">0 ₸</b>
    </div>

    <button id="sendWA" class="primary">Отправить в WhatsApp</button>
    <button id="clearCart" class="ghost">Очистить корзину</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
